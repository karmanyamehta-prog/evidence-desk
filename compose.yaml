services:
  ollama:
    image: ollama/ollama:0.34.4
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-models:/root/.ollama
  api:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /app/data
      OLLAMA_URL: http://ollama:11434
      HF_HOME: /app/.cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app-data:/app/data
      - model-cache:/app/.cache
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      start_period: 180s
      retries: 5
  ui:
    build: .
    command: ["python", "-m", "streamlit", "run", "ui/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--browser.gatherUsageStats=false"]
    environment:
      API_URL: http://api:8000
      MODEL_TIMEOUT: "180"
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
volumes:
  ollama-models:
  app-data:
  model-cache:
