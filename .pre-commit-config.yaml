repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.11
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1000]
        # Evaluation runs are the primary evidence for every number this
        # project reports, and they embed the full retrieved and packed source
        # text for every row. The 3B run is 1.3 MB for that reason alone.
        # The guard still applies to everything else, which is where an
        # accidental binary blob would land.
        exclude: ^evaluation/runs/.*
