[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
[project]
name = "grounded-qa"
version = "0.1.0"
description = "Local document QA with inspectable source evidence"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]
[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
[tool.setuptools.packages.find]
include = ["grounded_qa*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 88
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]
[tool.ruff.lint.isort]
known-first-party = ["grounded_qa"]
[tool.coverage.run]
source = ["grounded_qa"]
branch = true
[tool.coverage.report]
show_missing = true
skip_covered = true
