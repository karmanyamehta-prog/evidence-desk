name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.12.11
      - run: ruff check .
      - run: ruff format --check .
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e . -r requirements-dev.txt
      - run: mypy grounded_qa --ignore-missing-imports --no-strict-optional
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e . -r requirements-dev.txt
      - run: pip check
      - name: Test with coverage
        run: python -m pytest -q --cov --cov-report=xml --cov-report=term-missing --cov-fail-under=80
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14
  lock:
    # The lock file must still resolve and still match the requirements, or
    # the pinned environment is decorative.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.13.4
      - name: Verify the lock file installs from its pinned hashes
        run: uv pip install --system --require-hashes -r requirements-linux.lock.txt
      - name: Verify the lock file is up to date
        run: |
          uv pip compile requirements-dev.txt --python-platform linux --python-version 3.12 --generate-hashes --exclude-newer 2026-10-01T00:00:00Z --output-file /tmp/regenerated.lock.txt
          # uv records the output path in a header comment, so compare the
          # package lines only.
          diff -u <(grep -v '^#' requirements-linux.lock.txt) <(grep -v '^#' /tmp/regenerated.lock.txt)
