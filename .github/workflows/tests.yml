name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e . -r requirements-dev.txt
      - run: ruff check grounded_qa tests ui deploy/spaces/start.py
      - run: ruff format --check grounded_qa tests ui deploy/spaces/start.py
      - run: python -m pytest -q
